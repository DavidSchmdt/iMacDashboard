<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="21600"><!-- Notanker: lädt auch neu, wenn app.js kaputt ist -->
<title>Flur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="board">
  <section class="col col-left">
    <div class="tile clock" id="clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
    </div>

    <div class="tile waste" id="waste">
      <header><h2>Müllabfuhr</h2><span class="stamp"></span></header>
      <div class="body"></div>
    </div>

    <div class="tile weather" id="weather">
      <header><h2>Wetter</h2><span class="stamp"></span></header>
      <div class="body"></div>
    </div>
  </section>

  <section class="col col-mid">
    <div class="tile trains" id="trains">
      <header><h2>Abfahrten</h2><span class="stamp"></span></header>
      <div class="body"></div>
    </div>

    <div class="tile news" id="news">
      <header><h2>Nachrichten</h2><span class="stamp"></span></header>
      <div class="body"></div>
    </div>
  </section>

  <section class="col col-right">
    <div class="tile photo" id="photo">
      <div class="frame"></div>
      <div class="caption"><span class="title"></span><span class="sub"></span></div>
    </div>

    <div class="tile tips" id="tips">
      <div class="tip">
        <div class="tip-label" id="tip-label">Tipp</div>
        <div class="tip-text" id="tip-text"></div>
      </div>
      <div class="loading" aria-hidden="true">
        <span class="spin"></span><span class="ld" id="tip-ld">Lädt</span>
        <span class="bar"><i id="tip-bar"></i></span><span class="pct" id="tip-pct"></span>
      </div>
    </div>
  </section>
</div>
<div class="offline" id="offline" hidden>Server nicht erreichbar – zeige letzte Daten</div>
<button class="leave" id="leave" type="button">Zum Desktop <span class="key">Esc</span></button>
<div class="version" id="version"></div>
<div class="night-veil" id="veil"></div>
<script src="app.js"></script>
</body>
</html>
